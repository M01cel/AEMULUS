name: Windows desktop
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --clean --noconfirm --windowed --onedir --name AEMULUS desktop.py
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: powershell
        run: '& "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: AEMULUS-Setup-x64
          path: output/AEMULUS-Setup-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AEMULUS-Windows-x64
          path: dist/AEMULUS
